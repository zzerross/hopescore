  :root{
    --ink:#1B1E24;
    --paper:#F6F3EC;
    --surface:#FFFFFF;
    --paper-line:#E6E0D1;
    --chord:#2B5F8A;
    --section:#A6602B;
    --muted:#8A8577;
    --accent:#A6602B;
    --danger:#B3432B;
    --focus:#2B5F8A;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECE7DA;
      --paper:#14171C;
      --surface:#1B1F26;
      --paper-line:#2A2F38;
      --chord:#7FB4E0;
      --section:#E3A15C;
      --muted:#8E8A7C;
      --accent:#E3A15C;
      --danger:#E08469;
      --focus:#7FB4E0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECE7DA;
    --paper:#14171C;
    --surface:#1B1F26;
    --paper-line:#2A2F38;
    --chord:#7FB4E0;
    --section:#E3A15C;
    --muted:#8E8A7C;
    --accent:#E3A15C;
    --danger:#E08469;
    --focus:#7FB4E0;
    color-scheme: dark;
  }

  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  h1,h2,h3{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
  button{ font-family:inherit; }
  input,select,textarea{ font-family:inherit; }

  .mono{
    font-family:'Share Tech Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }

  /* ---------- app shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:14px;
    padding:12px 20px;
    background:var(--paper);
    border-bottom:1px solid var(--paper-line);
  }
  .topbar-scroll{
    display:flex; align-items:center; gap:8px; flex:1; min-width:0; overflow-x:auto;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  .topbar-scroll::-webkit-scrollbar{ display:none; }
  .topbar-scroll > *{ flex:none; }
  .topbar-listactions{ display:flex; align-items:center; gap:6px; }
  .topbar-listactions > *{ flex:none; }
  .topbar-listactions .iconbtn, .topbar-scroll .iconbtn{ white-space:nowrap; }
  .topbar-key-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:30px; padding:0 6px;
    border-radius:8px; border:none; background:var(--accent); color:var(--surface);
    font-family:'Fraunces'; font-weight:700; font-size:13px; cursor:pointer;
  }
  .topbar-key-badge:hover{ opacity:.85; }
  .topbar-song-title{ font-family:'Fraunces'; font-weight:700; font-size:16px; white-space:nowrap; }
  .topbar-song-artist{ color:var(--muted); font-size:12px; white-space:nowrap; }
  .topbar-divider{ width:1px; align-self:stretch; background:var(--paper-line); margin:0 2px; }
  .iconbtn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    height:36px; padding:0 12px;
    border-radius:8px; border:1px solid var(--paper-line);
    background:var(--surface); color:var(--ink);
    font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .iconbtn:hover{ border-color:var(--focus); }
  .iconbtn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--focus); outline-offset:2px;
  }
  .iconbtn.primary{ background:var(--accent); border-color:var(--accent); color:var(--surface); }
  .iconbtn.danger{ border-color:var(--danger); color:var(--danger); background:transparent; }
  .iconbtn:disabled{ opacity:.4; cursor:not-allowed; }
  .topbar-listactions .iconbtn{ width:38px; padding:0; font-size:16px; position:relative; }
  .btn-badge{
    position:absolute; top:1px; right:1px; min-width:14px; height:14px; padding:0 3px;
    border-radius:999px; background:var(--accent); color:var(--surface);
    font-size:9px; font-weight:700; line-height:14px; text-align:center;
    font-variant-numeric:tabular-nums;
  }

  main{ flex:1; width:100%; }
  .wrap{ max-width:820px; margin:0 auto; padding:28px 20px 80px; }
  /* The chord/lyric view wants to use as much of the screen as it can, so
     the song view trims the outer padding much tighter than list/edit. */
  .wrap.song-view{ padding:6px 6px 24px; }

  /* ---------- list view ---------- */
  .list-head{ display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .list-head h2{ font-size:26px; font-weight:700; }
  .search{
    width:100%; margin-bottom:6px; padding:10px 14px; border-radius:9px;
    border:1px solid var(--paper-line); background:var(--surface); color:var(--ink); font-size:14px;
  }
  .song-list{ border-top:1px solid var(--paper-line); }
  .song-row{
    display:grid; grid-template-columns:30px 1fr; align-items:center; gap:14px;
    padding:11px 4px; border-bottom:1px solid var(--paper-line); cursor:pointer;
  }
  .song-row:hover{ background:var(--surface); }
  .song-badge{
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    font-variant-numeric: tabular-nums;
    flex-shrink:0; cursor:pointer; background:transparent; color:var(--muted);
    border:1.5px dashed var(--paper-line);
  }
  .song-badge:hover{ border-color:var(--focus); color:var(--focus); }
  .song-badge.assigned{
    border-style:solid; border-color:var(--accent); background:var(--accent); color:var(--surface);
  }
  .song-badge.assigned:hover{ opacity:.85; }
  .song-title{ font-family:'Fraunces'; font-weight:600; font-size:15px; }
  .empty-state{ padding:40px 4px; color:var(--muted); text-align:center; font-size:14px; }
  .pill{
    display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
    background:var(--surface); border:1px solid var(--paper-line); color:var(--muted);
  }

  /* ---------- editor view ---------- */
  .editor-grid{ display:grid; grid-template-columns:360px 1fr; gap:28px; align-items:start; }
  @media (max-width:860px){ .editor-grid{ grid-template-columns:1fr; } }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
  .field input[type=text], .field select, .field textarea{
    width:100%; padding:10px 12px; border-radius:9px; border:1px solid var(--paper-line);
    background:var(--surface); color:var(--ink); font-size:14.5px;
  }
  .field textarea{ resize:vertical; }
  .field-row{ display:flex; gap:10px; }
  .field-row > *{ flex:1; }
  #bodyInput{ min-height:340px; line-height:1.55; font-size:14px; }
  .preview-panel{ min-height:340px; }
  .preview-label{ font-size:12.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px; }
  .hint{ color:var(--muted); font-size:12px; margin-top:6px; line-height:1.5; }

  /* ---------- song view ---------- */
  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:16px 0 20px;
    padding:12px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--paper-line);
  }
  .toolbar label{ font-size:12px; color:var(--muted); font-weight:600; margin-right:4px; }
  .toolbar select{ padding:7px 10px; border-radius:8px; border:1px solid var(--paper-line); background:var(--paper); color:var(--ink); font-size:13px; }
  .seg{ display:flex; border:1px solid var(--paper-line); border-radius:8px; overflow:hidden; }
  .seg button{ border:none; background:var(--paper); color:var(--ink); padding:7px 12px; font-size:13px; cursor:pointer; }
  .seg button.active{ background:var(--accent); color:var(--surface); font-weight:700; }
  .font-size-label{
    display:flex; align-items:center; padding:0 8px; font-size:13px; color:var(--ink);
    font-variant-numeric: tabular-nums; background:var(--paper);
  }
  .toolbar-spacer{ flex:1; }

  .chart-card{
    border:1px solid var(--paper-line); border-radius:16px; background:var(--surface);
    padding:14px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    overflow:hidden;
  }
  .chart{ display:flex; white-space:pre; max-width:100%; }
  .chart-col{ white-space:pre; min-width:0; }
  .row-title{ color:var(--section); font-weight:700; font-size:1.3em; margin-bottom:.15em; }

<script>
"use strict";

/* =========================================================================
   1. Chord theory: note math, transpose, Nashville Number System
   ========================================================================= */
const BASE_SEMITONE = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function noteToSemitone(noteStr){
  const letter = noteStr[0];
  const acc = noteStr.slice(1);
  let s = BASE_SEMITONE[letter];
  if (acc === '#') s += 1;
  else if (acc === 'b') s -= 1;
  return ((s % 12) + 12) % 12;
}
const SHARP_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NAMES  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function spellNote(semitone, preferFlat){
  const s = ((semitone % 12) + 12) % 12;
  return (preferFlat ? FLAT_NAMES : SHARP_NAMES)[s];
}
function transposeNoteName(noteStr, shift, preferFlat){
  const s = (noteToSemitone(noteStr) + shift + 1200) % 12;
  return spellNote(s, preferFlat);
}
const MAJOR_PREF_BY_SEMITONE = ['sharp','flat','sharp','flat','sharp','flat','sharp','sharp','flat','sharp','flat','sharp'];
function keyPreference(semitone){ return MAJOR_PREF_BY_SEMITONE[((semitone%12)+12)%12]; }

const CHORD_RE = /^([A-G])([#b]?)([A-Za-z0-9#+]*)(?:\/([A-G])([#b]?))?$/;
const QUAL_STRICT_RE = /^[0-9]*(?:(?:maj|min|dim|aug|sus|add|m|b5|#5|b9|#9|b13|#11)[0-9]*)*$/i;
// Bar-notation progressions (e.g. "G | Am7 | C | G || x2") mix chords with
// bar lines, repeat markers and a trailing repeat count -- all of these need
// to be accepted as part of a chord line so the whole line (and its chords)
// gets transposed/converted, instead of falling through to plain lyric text.
const SPECIAL_TOKENS = new Set(['N.C.','NC','%','/','-','|','||','|:',':|','||:',':||']);
const REPEAT_COUNT_RE = /^x[0-9]+$/i;
function baseChordToken(text){
  const m = text.match(CHORD_RE);
  return !!(m && QUAL_STRICT_RE.test(m[3]));
}
// Some charts write a chord held for several beats/bars as the chord typed
// back-to-back with no separator ("DDDD" for "D D D D") instead of spacing
// or a bar-notation repeat count. Detect that so it's still recognized (and
// transposed as a unit) rather than falling through to plain lyric text.
function repeatedChordUnit(text){
  for (let len=1; len<text.length; len++){
    if (text.length % len !== 0) continue;
    const unit = text.slice(0, len);
    if (unit.repeat(text.length/len) !== text) continue;
    if (baseChordToken(unit)) return {unit, count: text.length/len};
  }
  return null;
}
function isChordToken(text){
  if (baseChordToken(text)) return true;
  if (SPECIAL_TOKENS.has(text)) return true;
  if (REPEAT_COUNT_RE.test(text)) return true;
  return !!repeatedChordUnit(text);
}

function transposeChord(text, shift, preferFlat){
  const rep = repeatedChordUnit(text);
  if (rep) return transposeChord(rep.unit, shift, preferFlat).repeat(rep.count);
  const m = text.match(CHORD_RE);
  if (!m) return text;
  const [, root, acc, qual, bassRoot, bassAcc] = m;
  let out = transposeNoteName(root+acc, shift, preferFlat) + qual;
  if (bassRoot) out += '/' + transposeNoteName(bassRoot+(bassAcc||''), shift, preferFlat);
  return out;
}
const NNS_TABLE = ['1','b2','2','b3','3','4','#4','5','b6','6','b7','7'];
function toNashville(text, baseSemitone){
  const rep = repeatedChordUnit(text);
  if (rep) return toNashville(rep.unit, baseSemitone).repeat(rep.count);
  const m = text.match(CHORD_RE);
  if (!m) return text;
  const [, root, acc, qual, bassRoot, bassAcc] = m;
  const rs = noteToSemitone(root+acc);
  const diff = ((rs - baseSemitone) % 12 + 12) % 12;
  let out = NNS_TABLE[diff] + qual;
  if (bassRoot) {
    const bs = noteToSemitone(bassRoot+(bassAcc||''));
    const bdiff = ((bs - baseSemitone) % 12 + 12) % 12;
    out += '/' + NNS_TABLE[bdiff];
  }
  return out;
}
function makeTransform(mode, base, target){
  if (mode === 'nashville') return (t)=>toNashville(t, base.semitone);
  const useTarget = mode === 'transposed';
  const shift = useTarget ? (((target.semitone - base.semitone) % 12) + 12) % 12 : 0;
  const preferFlat = useTarget ? target.preferFlat : base.preferFlat;
  return (t)=>transposeChord(t, shift, preferFlat);
}

// The 5 black-key pitch classes have two valid letter names (e.g. C#/Db);
// which one is "correct" depends on convention, not math, so the key picker
// offers both and lets the user's choice drive every chord spelled in that
// key -- rather than silently guessing one via the circle-of-fifths table.
const AMBIGUOUS_SEMITONES = new Set([1,3,6,8,10]);
// value = "semitone:isMinor:preferFlat" -- preferFlat is explicit so C# and
// Db (same pitch) can be told apart; parseKeyValue() falls back to the old
// circle-of-fifths table for legacy 2-part values that predate this field.
function keyOptionsHTML(selected){
  function optionsFor(isMinor){
    let html = '';
    for (let s=0;s<12;s++){
      const pfChoices = AMBIGUOUS_SEMITONES.has(s) ? [0,1] : [keyPreference(isMinor?(s+3)%12:s)==='flat' ? 1 : 0];
      for (const pf of pfChoices){
        const name = spellNote(s, !!pf) + (isMinor?'m':'');
        const val = `${s}:${isMinor?1:0}:${pf}`;
        html += `<option value="${val}" ${val===selected?'selected':''}>${name}</option>`;
      }
    }
    return html;
  }
  return `<optgroup label="Major">${optionsFor(false)}</optgroup><optgroup label="Minor">${optionsFor(true)}</optgroup>`;
}
function parseKeyValue(val){
  const parts = String(val==null?'':val).split(':');
  const semitone = Number(parts[0])||0;
  const isMinor = Number(parts[1]) === 1;
  let preferFlat;
  if (parts.length >= 3 && parts[2] !== ''){
    preferFlat = Number(parts[2]) === 1;
  } else {
    const relMajor = isMinor ? (semitone+3)%12 : semitone;
    preferFlat = keyPreference(relMajor) === 'flat';
  }
  return {semitone, isMinor, preferFlat};
}
// A song's own key predates the preferFlat field, so fall back to the old
// table-based guess for songs saved before this feature existed.
function songBaseKey(song){
  const preferFlat = song.keyPreferFlat !== undefined
    ? !!song.keyPreferFlat
    : parseKeyValue(`${song.keySemitone}:${song.keyIsMinor?1:0}`).preferFlat;
  return {semitone: song.keySemitone, preferFlat};
}
function songKeyValue(song){
  const base = songBaseKey(song);
  return `${song.keySemitone}:${song.keyIsMinor?1:0}:${base.preferFlat?1:0}`;
}
function keyLabel(semitone, isMinor, preferFlat){
  if (preferFlat === undefined){
    const relMajor = isMinor ? (semitone+3)%12 : semitone;
    preferFlat = keyPreference(relMajor) === 'flat';
  }
  return spellNote(semitone, preferFlat) + (isMinor?'m':'');
}
// Splits a title like "We Fall Down by Chris Tomlin" into the song name and
// the attribution, so lists can show just the name and the song page can
// show the attribution small, alongside the key.
function splitTitleArtist(title){
  let m = title.match(/^(.*?)\s+by\s+(.+)$/i);
  if (m) return {main: m[1], artist: m[2]};
  // " - Artist" (dash with spaces on both sides, so "Praise-Elevation" style
  // titles with no surrounding spaces are left alone)
  m = title.match(/^(.*?)\s-\s(.+)$/);
  if (m) return {main: m[1], artist: m[2]};
  return {main: title, artist: null};
}

/* =========================================================================
   2. Parser: plain text -> blocks
   ========================================================================= */
function tokenizeLine(line){
  return [...line.matchAll(/\S+/g)].map(m=>({text:m[0], col:m.index}));
}
function lineIsChordLine(line){
  const toks = tokenizeLine(line);
  return toks.length>0 && toks.every(t=>isChordToken(t.text));
}
// Recognizes common part/section names on their own line -- "Verse 1",
// "[Chorus]", "Pre-Chorus:", "Bridge x2" -- with no special markup needed.
// A leading "##" still works too, for a custom name outside this vocabulary.
const SECTION_WORD_RE = /^\[?\s*(verse|chorus|bridge|intro|outro|tag|pre-?chorus|interlude|refrain|ending|repeat|vamp|instrumental|breakdown)\s*(?:([0-9]+)\s*(x)?|(x)\s*([0-9]*))?\s*:?\s*\]?$/i;
function detectSectionLabel(trimmed){
  const m = trimmed.match(SECTION_WORD_RE);
  if (!m) return null;
  const word = /pre-?chorus/i.test(m[1]) ? 'Pre-Chorus' : m[1][0].toUpperCase()+m[1].slice(1).toLowerCase();
  // repeat count can be written as "2x" (number first) or "x2" (x first, e.g. "Bridge x2")
  let suffix = '';
  if (m[2]) suffix = m[2] + (m[3]?'x':'');
  else if (m[4]) suffix = 'x' + (m[5]||'');
  return suffix ? `${word} ${suffix}` : word;
}
function parseBody(bodyText, collapseBlanks){
  if (collapseBlanks === undefined) collapseBlanks = true;
  const rawLines = (bodyText||'').replace(/\r\n/g,'\n').split('\n');
  const blocks = [];
  let i = 0;
  while (i < rawLines.length){
    const line = rawLines[i];
    const trimmed = line.trim();
    if (trimmed === ''){
      blocks.push({type:'blank'});
      i++;
      if (collapseBlanks){
        while (i < rawLines.length && rawLines[i].trim() === '') i++;
      }
      continue;
    }
    if (trimmed.startsWith('##')){
      blocks.push({type:'section', text: trimmed.replace(/^##\s*/, '')});
      i++; continue;
    }
    const autoSection = detectSectionLabel(trimmed);
    if (autoSection){
      blocks.push({type:'section', text: autoSection});
      i++; continue;
    }
    if (lineIsChordLine(line)){
      const tokens = tokenizeLine(line);
      const next = rawLines[i+1];
      let nextIsChord = false, nextIsSection = false, nextIsBlank = false;
      if (next !== undefined){
        const nt = next.trim();
        nextIsBlank = nt === '';
        nextIsSection = nt.startsWith('##') || !!detectSectionLabel(nt);
        nextIsChord = !nextIsBlank && !nextIsSection && lineIsChordLine(next);
      }
      if (next !== undefined && !nextIsChord && !nextIsSection && !nextIsBlank){
        blocks.push({type:'pair', chordTokens: tokens, lyric: next});
        i += 2; continue;
      } else {
        blocks.push({type:'chordOnly', chordTokens: tokens});
        i++; continue;
      }
    }
    blocks.push({type:'lyricOnly', text: line});
    i++;
  }
  return blocks;
}

/* =========================================================================
   3. Column realignment (keeps chord columns lined up over lyrics)
   ========================================================================= */
function realignPair(chordTokens, lyricStr, transformFn){
  let lyricArr = Array.from(lyricStr);
  let shift = 0;
  const placed = [];
  for (const tok of chordTokens){
    const newText = transformFn(tok.text);
    const oldW = tok.text.length;
    const newW = newText.length;
    const effectiveCol = tok.col + shift;
    if (newW <= oldW){
      placed.push({col: effectiveCol, text: newText + ' '.repeat(oldW-newW)});
    } else {
      const delta = newW - oldW;
      const insertAt = Math.min(effectiveCol, lyricArr.length);
      const before = lyricArr.slice(0, insertAt);
      const after = lyricArr.slice(insertAt);
      const isMidWord = before.length && after.length && before[before.length-1] !== ' ' && after[0] !== ' ';
      const fillChar = isMidWord ? '-' : ' ';
      const fill = Array(delta).fill(fillChar);
      lyricArr = [...before, ...fill, ...after];
      placed.push({col: effectiveCol, text: newText});
      shift += delta;
    }
  }
  let chordOut = '';
  for (const p of placed){
    while (chordOut.length < p.col) chordOut += ' ';
    chordOut += p.text;
  }
  return { chordLine: chordOut, lyricLine: lyricArr.join('') };
}
function realignChordOnly(chordTokens, transformFn){
  let pos = 0, out = '';
  chordTokens.forEach((tok, idx)=>{
    const newText = transformFn(tok.text);
    let startCol = tok.col;
    if (idx>0) startCol = Math.max(startCol, pos+1);
    while (out.length < startCol) out += ' ';
    out += newText;
    pos = out.length;
  });
  return out;
}
function renderBlocks(blocks, transformFn){
  return blocks.map(b=>{
    if (b.type==='pair'){
      const {chordLine, lyricLine} = realignPair(b.chordTokens, b.lyric, transformFn);
      return {type:'pair', chordLine, lyricLine};
    }
    if (b.type==='chordOnly'){
      return {type:'chordOnly', chordLine: realignChordOnly(b.chordTokens, transformFn)};
    }
    return b;
  });
}

const modalBackdrop = document.getElementById('modalBackdrop');

modalBackdrop.addEventListener('click', (e)=>{ if (e.target===modalBackdrop) closeModal(); });

function confirmModal(title, message, confirmLabel='Delete'){
  return new Promise((resolve)=>{
    modalBox.innerHTML = `
      <h3>${escapeHtml(title)}</h3>
      <p class="msg">${escapeHtml(message)}</p>
      <div class="modal-actions">
        <button class="iconbtn" id="modalCancel">Cancel</button>
        <button class="iconbtn danger" id="modalOk">${escapeHtml(confirmLabel)}</button>
      </div>`;
    modalBackdrop.classList.add('open');
    document.getElementById('modalCancel').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('modalOk').onclick = ()=>{ closeModal(); resolve(true); };
  });
}
let toastTimer=null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Pulls a video id out of any YouTube URL shape (youtu.be short links,
// watch?v=, embed/, shorts/); returns null for anything else.
function parseYoutubeId(url){
  try{
    const u = new URL(url);
    const host = u.hostname.replace(/^www\.|^m\./,'');
    if (host === 'youtu.be') return u.pathname.slice(1).split('/')[0] || null;
    if (host === 'youtube.com'){
      if (u.pathname === '/watch') return u.searchParams.get('v');
      const m = u.pathname.match(/^\/(?:embed|shorts)\/([\w-]+)/);
      if (m) return m[1];
    }
  }catch(e){ /* not a URL */ }
  return null;
}
// A line that is *only* a YouTube link (the common case: pasted on its own
// line under a section like "Intro") gets rendered as a clickable link
// instead of raw URL text.
function wholeLineYoutubeId(text){
  const trimmed = (text||'').trim();
  return /^https?:\/\/\S+$/.test(trimmed) ? parseYoutubeId(trimmed) : null;
}
// Collects every distinct YouTube video referenced anywhere in the body, in
// first-seen order, so the song view can show one embedded player per video.
function extractYoutubeIds(bodyText){
  const ids = []; const seen = new Set();
  const re = /https?:\/\/\S+/g;
  let m;
  while ((m = re.exec(bodyText||''))){
    const id = parseYoutubeId(m[0]);
    if (id && !seen.has(id)){ seen.add(id); ids.push(id); }
  }
  return ids;
}
function computeSongRows(song, mode, targetVal){
  const blocks = parseBody(song.body, getCollapseBlanks());
  const transform = makeTransform(mode, songBaseKey(song), parseKeyValue(targetVal));
  const rendered = renderBlocks(blocks, transform);
  const rows = [];
  rows.push({cls:'row-title', text: splitTitleArtist(song.title).main});
  if (song.description) rows.push({cls:'row-desc', text: song.description});
  for (const b of rendered){
    if (b.type==='section') rows.push({cls:'row-section', text:b.text});
    else if (b.type==='blank') rows.push({cls:'row-blank', text:''});
    else if (b.type==='lyricOnly'){
      const ytId = wholeLineYoutubeId(b.text);
      if (ytId) rows.push({cls:'row-lyric row-link', text:b.text.trim(), href:`https://www.youtube.com/watch?v=${ytId}`});
      else rows.push({cls:'row-lyric', text:b.text});
    }
    else if (b.type==='chordOnly') rows.push({cls:'row-chord', text:b.chordLine});
    else if (b.type==='pair'){
      rows.push({cls:'row-chord', text:b.chordLine});
      rows.push({cls:'row-lyric', text:b.lyricLine});
    }
  }
  return rows;
}
function rowsToChartDom(rows, container){
  container.innerHTML='';
  for (const r of rows){
    const div = document.createElement('div');
    div.className = 'line ' + r.cls;
    if (r.href){
      const a = document.createElement('a');
      a.href = r.href; a.target = '_blank'; a.rel = 'noopener noreferrer';
      a.textContent = r.text || r.href;
      div.appendChild(a);
    } else {
      div.textContent = r.text || ' ';
    }
    container.appendChild(div);
  }
}
function splitRowsForColumns(rows){
  // Group rows into chunks separated by blank rows, so a chord/lyric pair or a
  // section header is never torn across the column break, then pick whichever
  // chunk boundary lands closest to the halfway point by line count.
  const chunks = [];
  let cur = [];
  for (const r of rows){
    cur.push(r);
    if (r.cls === 'row-blank'){ chunks.push(cur); cur = []; }
  }
  if (cur.length) chunks.push(cur);
  const total = rows.length;
  let running = 0, bestDiff = Infinity, bestIdx = chunks.length;
  for (let i=0;i<chunks.length;i++){
    running += chunks[i].length;
    const diff = Math.abs(running - total/2);
    if (diff < bestDiff){ bestDiff = diff; bestIdx = i+1; }
  }
  const col1 = chunks.slice(0, bestIdx).flat();
  const col2 = chunks.slice(bestIdx).flat();
  return col2.length ? [col1, col2] : [col1];
}

const CHART_COL_GAP = 24;

/* ---- fixed-size "wrap" mode: break long chord/lyric pairs onto continuation
   lines instead of shrinking the font, keeping their column alignment ---- */
function trimEnd(s){ return s.replace(/\s+$/,''); }
function findBreakPoints(text, maxChars){
  const len = text.length;
  if (len <= maxChars) return [[0,len]];
  const points = [];
  let pos = 0;
  while (pos < len){
    let end = Math.min(pos+maxChars, len);
    if (end < len){
      let cut = -1;
      for (let i=end; i>pos; i--){ if (text[i-1]===' '){ cut = i; break; } }
      if (cut > pos) end = cut;
    }
    points.push([pos, end]);
    pos = end;
  }
  return points;
}
// Wraps `primary` (used to choose break points, e.g. the lyric) together with
// `secondary` (e.g. the chord line above it) at the same cut positions, so
// wrapped continuation lines stay vertically aligned with each other.
function wrapAligned(primary, secondary, maxChars){
  const len = Math.max(primary.length, (secondary||'').length);
  if (len <= maxChars) return [[trimEnd(primary), trimEnd(secondary||'')]];
  const a = primary.padEnd(len, ' ');
  const b = (secondary||'').padEnd(len, ' ');
  return findBreakPoints(a, maxChars).map(([s,e]) => [trimEnd(a.slice(s,e)), trimEnd(b.slice(s,e))]);
}
function wrapRows(rows, maxChars){
  const out = [];
  for (let i=0;i<rows.length;i++){
    const r = rows[i];
    if (r.cls==='row-chord' && rows[i+1] && rows[i+1].cls==='row-lyric'){
      const segs = wrapAligned(rows[i+1].text, r.text, maxChars);
      for (const [lyricSeg, chordSeg] of segs){
        out.push({cls:'row-chord', text: chordSeg});
        out.push({cls:'row-lyric', text: lyricSeg});
      }
      i++;
      continue;
    }
    // A link row (e.g. a bare YouTube URL) is exempt from this monospace
    // character-splitting: breaking it would both look wrong and, since the
    // split pieces are plain new objects, drop its href entirely. It soft-
    // wraps instead via its own CSS (white-space: normal), so it never needs
    // to be split here to fit a column width.
    if (!r.href && r.cls !== 'row-blank' && (r.text||'').length > maxChars){
      for (const [seg] of wrapAligned(r.text, '', maxChars)) out.push({cls:r.cls, text:seg});
    } else {
      out.push(r);
    }
  }
  return out;
}
function measureMonoCharWidth(fontPx){
  const probe = document.createElement('span');
  probe.className = 'mono';
  probe.style.cssText = 'position:absolute; visibility:hidden; white-space:pre; top:-9999px;';
  probe.style.fontSize = fontPx+'px';
  probe.textContent = '0'.repeat(20);
  document.body.appendChild(probe);
  const w = probe.getBoundingClientRect().width / 20;
  document.body.removeChild(probe);
  return w || fontPx*0.6;
}

function buildChartColumns(container, colBlocks, boxWidth, colWidth, gap){
  container.innerHTML = '';
  container.style.width = boxWidth+'px';
  container.style.gap = gap+'px';
  colBlocks.forEach(block=>{
    const el = document.createElement('div');
    el.className = 'chart-col';
    el.style.width = colWidth+'px';
    rowsToChartDom(block, el);
    container.appendChild(el);
  });
}
// Groups rows into chunks separated by blank rows, so a chord/lyric pair or a
// section header is never torn apart when flowing across columns.
function chunkRows(rows){
  const chunks = [];
  let cur = [];
  for (const r of rows){
    cur.push(r);
    if (r.cls === 'row-blank'){ chunks.push(cur); cur = []; }
  }
  if (cur.length) chunks.push(cur);
  return chunks;
}
// Binary-searches how many *leading* chunks fit in one colWidth x boxHeight
// column at fontPx, using `probe` (an offscreen .chart-col) for real
// measurement. More chunks can only add height, so this is monotonic.
function countFittingChunks(probe, chunks, colWidth, boxHeight, fontPx){
  let lo = 0, hi = chunks.length, best = 0;
  while (lo <= hi){
    const mid = (lo+hi) >> 1;
    probe.style.width = colWidth+'px';
    rowsToChartDom(chunks.slice(0, mid).flat(), probe);
    probe.style.fontSize = fontPx+'px';
    probe.style.lineHeight = '1.45';
    const fits = probe.scrollHeight <= boxHeight + 1 && probe.scrollWidth <= colWidth + 1;
    if (fits){ best = mid; lo = mid+1; } else { hi = mid-1; }
  }
  return best;
}
// Flows `rows` (after wrapping any line too wide for a column at fontPx) into
// up to `columns` columns newspaper-style: fills column 1 to boxHeight, spills
// the rest into column 2, and so on -- rather than pre-splitting evenly.
// Returns the resulting column blocks plus any chunks that fit nowhere (only
// non-empty when even `columns` columns can't hold everything at fontPx).
function flowFit(rows, columns, boxWidth, boxHeight, fontPx){
  const gap = columns===2 ? CHART_COL_GAP : 0;
  const colWidth = columns===2 ? (boxWidth-gap)/2 : boxWidth;
  const charW = measureMonoCharWidth(fontPx);
  const maxChars = Math.max(6, Math.floor(colWidth / charW));
  const chunks = chunkRows(wrapRows(rows, maxChars));

  const probe = document.createElement('div');
  probe.className = 'chart-col';
  probe.style.cssText = 'position:absolute; visibility:hidden; left:-9999px; top:0;';
  document.body.appendChild(probe);

  let remaining = chunks;
  const colBlocks = [];
  for (let c=0; c<columns && remaining.length>0; c++){
    let n = countFittingChunks(probe, remaining, colWidth, boxHeight, fontPx);
    if (n === 0) n = 1; // guarantee progress even if one chunk alone overflows
    colBlocks.push(remaining.slice(0, n).flat());
    remaining = remaining.slice(n);
  }
  document.body.removeChild(probe);
  return { colBlocks, overflow: remaining };
}
// Binary-searches the largest font size at which flowFit places every chunk
// within `columns` columns with no leftover. Returns {size, fits} -- fits is
// false if even the smallest usable size still has leftover content.
function searchFlowFit(rows, columns, boxWidth, boxHeight){
  let lo = 6, hi = 60, best = 6, bestFits = false;
  while (lo <= hi){
    const mid = (lo+hi) >> 1;
    const fits = flowFit(rows, columns, boxWidth, boxHeight, mid).overflow.length === 0;
    if (fits){ best = mid; bestFits = true; lo = mid+1; } else { hi = mid-1; }
  }
  return {size: best, fits: bestFits};
}

// Lays rows into 1 or 2 fixed-width columns and renders them into `container`.
// fitMode 'auto' (default): finds the largest font size that flows the whole
//   chart across `columns` columns with no scrolling -- wrapping any outlier
//   long line, then spilling overfull columns into the next one (see
//   flowFit/searchFlowFit) -- and only as a last resort, when even that
//   doesn't fit at the smallest usable size, renders at the floor size with
//   the remainder appended to the last column and left to scroll.
// fitMode 'wrap': keeps opts.fontSize fixed, evenly splits into columns, and
//   always wraps long lines; the result may be taller than boxHeight and is
//   left to scroll.
// Returns {size, scrolled}.
function layoutChart(container, rows, columns, boxWidth, boxHeight, opts){
  opts = opts || {};

  if (opts.fitMode === 'wrap'){
    const wrapColWidth = columns===2 ? (boxWidth-CHART_COL_GAP)/2 : boxWidth;
    const charW = measureMonoCharWidth(opts.fontSize);
    const maxChars = Math.max(6, Math.floor(wrapColWidth / charW));
    const displayRows = wrapRows(rows, maxChars);
    const colBlocks = columns===2 ? splitRowsForColumns(displayRows) : [displayRows];
    const n = colBlocks.length;
    const gap = n===2 ? CHART_COL_GAP : 0;
    const colWidth = n===2 ? (boxWidth-gap)/2 : boxWidth;
    buildChartColumns(container, colBlocks, boxWidth, colWidth, gap);
    container.style.fontSize = opts.fontSize+'px';
    container.style.lineHeight = '1.45';
    return { size: opts.fontSize, scrolled: false };
  }

  const search = searchFlowFit(rows, columns, boxWidth, boxHeight);
  const final = flowFit(rows, columns, boxWidth, boxHeight, search.size);
  const colBlocks = final.colBlocks.length ? final.colBlocks : [[]];
  if (final.overflow.length){
    colBlocks[colBlocks.length-1] = colBlocks[colBlocks.length-1].concat(final.overflow.flat());
  }
  const n = colBlocks.length;
  const gap = n===2 ? CHART_COL_GAP : 0;
  const colWidth = n===2 ? (boxWidth-gap)/2 : boxWidth;
  buildChartColumns(container, colBlocks, boxWidth, colWidth, gap);
  container.style.fontSize = search.size+'px';
  container.style.lineHeight = '1.45';
  return { size: search.size, scrolled: !search.fits };
}

function renderTopbar(){
  const listSlot = document.getElementById('topbarListActions');
  const songSlot = document.getElementById('topbarSongActions');
  const editSlot = document.getElementById('topbarEditActions');

  listSlot.hidden = route.view !== 'list';
  if (route.view !== 'list') listSlot.innerHTML = '';
  songSlot.hidden = route.view !== 'song';
  if (route.view !== 'song') songSlot.innerHTML = '';
  editSlot.hidden = route.view !== 'edit';
  if (route.view !== 'edit') editSlot.innerHTML = '';
  // list/song/edit slots are populated by renderListView()/renderSongView()/renderEditView(), which run right after this
}

/* ---- list view ---- */
function renderListView(){
  const wrap = document.createElement('div');

  const slot = document.getElementById('topbarListActions');
  slot.innerHTML = `
    <button class="iconbtn" id="btnSetlist" title="Edit setlist">🎵<span class="btn-badge" id="setlistCount">${STATE.setlist.length}</span></button>
    <button class="iconbtn" id="btnClearSetlist" title="Clear setlist" ${STATE.setlist.length? '' : 'disabled'}>🧹</button>
    <button class="iconbtn primary" id="btnPresent" title="Present fullscreen" ${STATE.setlist.length? '' : 'disabled'}>▶</button>
    <button class="iconbtn primary" id="btnAdd" title="New song">+</button>
    <button class="iconbtn danger" id="btnDeleteSelected" title="Delete the songs currently numbered in the setlist" ${STATE.setlist.length? '' : 'disabled'}>🗑</button>`;
  const setlistBtn = slot.querySelector('#btnSetlist');
  const setlistCount = slot.querySelector('#setlistCount');
  const clearSetlistBtn = slot.querySelector('#btnClearSetlist');
  const deleteSelectedBtn = slot.querySelector('#btnDeleteSelected');
  const presentBtn = slot.querySelector('#btnPresent');
  function refreshHeaderCounts(){
    setlistCount.textContent = STATE.setlist.length;
    clearSetlistBtn.disabled = STATE.setlist.length===0;
    deleteSelectedBtn.disabled = STATE.setlist.length===0;
    presentBtn.disabled = STATE.setlist.length===0;
  }

  const search = document.createElement('input');
  search.className = 'search'; search.placeholder = 'Search song titles…'; search.id = 'searchInput';
  wrap.appendChild(search);

  const listEl = document.createElement('div');
  listEl.className = 'song-list';
  wrap.appendChild(listEl);

  function paint(filter){
    listEl.innerHTML = '';
    const q = (filter||'').trim().toLowerCase();
    const songs = STATE.songs.filter(s=> !q || s.title.toLowerCase().includes(q));
    if (songs.length===0){
      listEl.innerHTML = `<div class="empty-state">${STATE.songs.length? 'No songs match your search' : 'No songs yet. Tap "+ New" to add your first one.'}</div>`;
      return;
    }
    for (const s of songs){
      const idx = STATE.setlist.indexOf(s.id);
      const row = document.createElement('div');
      row.className = 'song-row';
      row.innerHTML = `
        <button class="song-badge ${idx===-1?'':'assigned'}" data-act="toggle-setlist" title="${idx===-1?'Add to setlist':'Remove from setlist'}">${idx===-1?'':idx+1}</button>
        <div class="song-title">${escapeHtml(splitTitleArtist(s.title).main)}</div>`;
      row.addEventListener('click', (e)=>{
        if (e.target.closest('[data-act]')) return;
        go({view:'song', songId:s.id});
      });
      row.querySelector('[data-act="toggle-setlist"]').addEventListener('click', (e)=>{
        e.stopPropagation();
        const i = STATE.setlist.indexOf(s.id);
        if (i===-1) STATE.setlist.push(s.id);
        else STATE.setlist.splice(i,1);
        saveState();
        refreshHeaderCounts();
        paint(search.value);
      });
      listEl.appendChild(row);
    }
  }
  paint('');
  search.addEventListener('input', ()=>paint(search.value));

  slot.querySelector('#btnAdd').addEventListener('click', ()=> go({view:'edit', songId:null}));
  setlistBtn.addEventListener('click', openSetlistModal);
  clearSetlistBtn.addEventListener('click', async ()=>{
    const ok = await confirmModal('Clear setlist', 'Remove all songs from the setlist? You can add them again anytime.', 'Clear');
    if (!ok) return;
    STATE.setlist = [];
    saveState();
    refreshHeaderCounts();
    paint(search.value);
  });
  deleteSelectedBtn.addEventListener('click', async ()=>{
    const targets = STATE.setlist.map(id=>STATE.songs.find(s=>s.id===id)).filter(Boolean);
    if (targets.length===0) return;
    const names = targets.map(s=>s.title).join(', ');
    const ok = await confirmModal('Delete selected songs', `Permanently delete ${targets.length} song(s): ${names}? This can't be undone.`);
    if (!ok) return;
    const idsToDelete = new Set(STATE.setlist);
    STATE.songs = STATE.songs.filter(s=>!idsToDelete.has(s.id));
    STATE.setlist = [];
    saveState();
    renderListView();
  });
  presentBtn.addEventListener('click', ()=> openPresent(STATE.setlist, 0));

  viewRoot.innerHTML=''; viewRoot.appendChild(wrap);
}

function openSetlistModal(){
  function paintModal(){
    const items = STATE.setlist.map(id=>STATE.songs.find(s=>s.id===id)).filter(Boolean);
    const available = STATE.songs.filter(s=> !STATE.setlist.includes(s.id));
    modalBox.style.maxWidth = '460px';
    modalBox.innerHTML = `
      <h3>Edit setlist</h3>
      <p class="msg">Add songs to order them, then use the arrows to reorder.</p>
      <div id="setlistItems" style="max-height:260px;overflow:auto;border:1px solid var(--paper-line);border-radius:9px;margin-bottom:12px;"></div>
      <select id="addSongSelect" style="width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper);color:var(--ink);margin-bottom:10px;">
        <option value="">+ Add a song to the setlist…</option>
        ${available.map(s=>`<option value="${s.id}">${escapeHtml(s.title)}</option>`).join('')}
      </select>
      <div class="modal-actions"><button class="iconbtn primary" id="modalOk">Close</button></div>`;
    const itemsEl = document.getElementById('setlistItems');
    items.forEach((s, i)=>{
      const row = document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--paper-line);font-size:13.5px;';
      row.innerHTML = `<span class="pill">${i+1}</span><span style="flex:1;">${escapeHtml(s.title)}</span>`;
      const up = document.createElement('button'); up.className='iconbtn'; up.textContent='↑'; up.style.cssText='height:26px;padding:0 8px;';
      const down = document.createElement('button'); down.className='iconbtn'; down.textContent='↓'; down.style.cssText='height:26px;padding:0 8px;';
      const rm = document.createElement('button'); rm.className='iconbtn danger'; rm.textContent='Remove'; rm.style.cssText='height:26px;padding:0 8px;';
      up.disabled = i===0; down.disabled = i===items.length-1;
      up.onclick = ()=>{ [STATE.setlist[i-1],STATE.setlist[i]]=[STATE.setlist[i],STATE.setlist[i-1]]; saveState(); paintModal(); };
      down.onclick = ()=>{ [STATE.setlist[i+1],STATE.setlist[i]]=[STATE.setlist[i],STATE.setlist[i+1]]; saveState(); paintModal(); };
      rm.onclick = ()=>{ STATE.setlist = STATE.setlist.filter(id=>id!==s.id); saveState(); paintModal(); };
      row.appendChild(up); row.appendChild(down); row.appendChild(rm);
      itemsEl.appendChild(row);
    });
    if (items.length===0) itemsEl.innerHTML = '<div style="padding:16px;color:var(--muted);font-size:13px;">No songs in the setlist yet.</div>';
    document.getElementById('addSongSelect').addEventListener('change', (e)=>{
      if (e.target.value){ STATE.setlist.push(e.target.value); saveState(); paintModal(); }
    });
    document.getElementById('modalOk').onclick = ()=>{ closeModal(); renderListView(); };
  }
  paintModal();
  modalBackdrop.classList.add('open');
}

/* ---- editor view ---- */
function renderEditView(songId){
  const existing = songId ? STATE.songs.find(s=>s.id===songId) : null;

  const slot = document.getElementById('topbarEditActions');
  slot.innerHTML = `
    <button class="iconbtn" id="btnCancel" title="Cancel">←</button>
    <button class="iconbtn primary" id="btnSave" title="Save">✓</button>
    ${existing? `<button class="iconbtn danger" id="btnDelete" title="Delete song">🗑</button>` : ''}`;

  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="list-head"><h2>${existing? 'Edit song' : 'New song'}</h2></div>
    <div class="editor-grid">
      <div>
        <div class="field"><label>Title</label><input type="text" id="fTitle" value="${existing?escapeHtml(existing.title):''}"></div>
        <div class="field"><label>Key</label><select id="fKey">${keyOptionsHTML(existing?songKeyValue(existing):'9:0:0')}</select></div>
        <div class="field"><label>Description (optional)</label><textarea id="fDesc" rows="2">${existing?escapeHtml(existing.description||''):''}</textarea></div>
        <div class="field">
          <label>Chords &amp; lyrics</label>
          <textarea id="bodyInput" class="mono" spellcheck="false">${existing?escapeHtml(existing.body):''}</textarea>
          <div class="hint">Part names (Verse, Chorus, Bridge, Intro, Pre-Chorus, Tag…) are recognized automatically on their own line — no special marks needed. For a custom name, start the line with ##. A chord-only line followed directly by a lyric line is paired and aligned automatically. A progression with no lyrics (like an intro) can be left as a chord line on its own.</div>
        </div>
      </div>
      <div class="preview-panel">
        <div class="preview-label">Preview</div>
        <div class="chart-card"><div class="chart mono" id="livePreview"></div></div>
      </div>
    </div>`;
  viewRoot.innerHTML=''; viewRoot.appendChild(wrap);

  const fTitle = document.getElementById('fTitle');
  const fKey = document.getElementById('fKey');
  const fDesc = document.getElementById('fDesc');
  const bodyInput = document.getElementById('bodyInput');
  const preview = document.getElementById('livePreview');
  const previewCard = preview.parentElement;

  // Mirrors the settings the song view itself would use: whatever this song's
  // own toolbar was last set to, or the device-wide defaults for a song that
  // hasn't been opened yet -- so what you see while editing matches what
  // you'll see after saving, not a fixed 1-column guess.
  const previewPrefs = (existing && songViewPrefs[existing.id]) || {columns: getDefaultColumns(), fitMode: getDefaultFitMode()};
  function refreshPreview(){
    const [ks, km, pf] = fKey.value.split(':').map(Number);
    const song = { title: fTitle.value||'(Untitled)', description: fDesc.value, body: bodyInput.value, keySemitone: ks, keyIsMinor: km, keyPreferFlat: !!pf };
    const rows = computeSongRows(song, 'original', null);
    requestAnimationFrame(()=>{
      const boxWidth = previewCard.clientWidth - 28;   // minus 14px+14px horizontal padding
      if (previewPrefs.fitMode === 'wrap'){
        previewCard.style.height = 'auto';
        previewCard.style.overflow = 'visible';
        layoutChart(preview, rows, previewPrefs.columns, boxWidth, Infinity, {fitMode:'wrap', fontSize: getFontSize()});
      } else {
        const top = previewCard.getBoundingClientRect().top;
        const cardHeight = Math.max(160, window.innerHeight - top - 24);
        previewCard.style.height = cardHeight + 'px';
        previewCard.style.overflow = 'hidden';
        const boxHeight = cardHeight - 28;           // minus 14px+14px vertical padding
        const result = layoutChart(preview, rows, previewPrefs.columns, boxWidth, boxHeight, {fitMode:'auto'});
        if (result.scrolled){
          previewCard.style.height = 'auto';
          previewCard.style.overflow = 'visible';
        }
      }
    });
  }
  [fTitle, fKey, fDesc, bodyInput].forEach(el=> el.addEventListener('input', refreshPreview));
  refreshPreview();

  slot.querySelector('#btnCancel').addEventListener('click', ()=> go({view: existing? 'song':'list', songId: existing? existing.id : undefined}));
  slot.querySelector('#btnSave').addEventListener('click', ()=>{
    const title = fTitle.value.trim();
    if (!title){ toast('Please enter a title'); fTitle.focus(); return; }
    const [ks, km, pf] = fKey.value.split(':').map(Number);
    if (existing){
      existing.title = title; existing.keySemitone = ks; existing.keyIsMinor = km; existing.keyPreferFlat = !!pf;
      existing.description = fDesc.value; existing.body = bodyInput.value; existing.updatedAt = Date.now();
      saveState(); toast('Saved'); go({view:'song', songId: existing.id});
    } else {
      const id = uid();
      STATE.songs.push({ id, title, keySemitone: ks, keyIsMinor: km, keyPreferFlat: !!pf, description: fDesc.value, body: bodyInput.value, createdAt: Date.now(), updatedAt: Date.now() });
      saveState(); toast('Added'); go({view:'song', songId: id});
    }
  });
  if (existing){
    slot.querySelector('#btnDelete').addEventListener('click', async ()=>{
      const ok = await confirmModal('Delete song', `Delete "${existing.title}"? This can't be undone.`);
      if (!ok) return;
      STATE.songs = STATE.songs.filter(x=>x.id!==existing.id);
      STATE.setlist = STATE.setlist.filter(id=>id!==existing.id);
      saveState(); toast('Deleted'); go({view:'list'});
    });
  }
}

/* ---- song view ---- */
let songViewPrefs = {}; // per-song: {mode, target, columns, fitMode, fontSize}
function renderSongView(songId){
  const song = STATE.songs.find(s=>s.id===songId);
  if (!song){ go({view:'list'}); return; }
  const prefs = songViewPrefs[songId] || (songViewPrefs[songId] = {
    mode:'original', target: songKeyValue(song), columns: getDefaultColumns(), fitMode: getDefaultFitMode()
  });
  const {main: titleMain, artist: titleArtist} = splitTitleArtist(song.title);
  function keyBadgeText(){
    if (prefs.mode === 'nashville') return '1-7';
    if (prefs.mode === 'transposed'){
      const t = parseKeyValue(prefs.target);
      return keyLabel(t.semitone, t.isMinor, t.preferFlat);
    }
    return keyLabel(song.keySemitone, !!song.keyIsMinor, songBaseKey(song).preferFlat);
  }

  const videoIds = extractYoutubeIds(song.body);
  // A live iframe embed needs YouTube to see a real HTTP(S) Referer header,
  // which browsers only send from an http:/https: page -- never from a
  // local file: or content: origin (a file manager's "open with browser"
  // intent, or a plain double-click open both reproduce this). No iframe
  // attribute, meta tag, or embed-URL variant can manufacture a referer
  // that isn't there, so on a local origin the embed is skipped entirely;
  // the link inline in the chord/lyric view already covers that case.
  const canEmbed = /^https?:$/.test(location.protocol);

  const slot = document.getElementById('topbarSongActions');
  slot.innerHTML = `
    <button class="iconbtn" id="backBtn" title="Back to songs">←</button>
    <button class="topbar-key-badge" id="keyBadgeBtn" title="Change key / view mode">${escapeHtml(keyBadgeText())}</button>
    <span class="topbar-song-title">${escapeHtml(titleMain)}</span>
    ${titleArtist? `<span class="topbar-song-artist">by ${escapeHtml(titleArtist)}</span>` : ''}
    <div class="topbar-divider"></div>
    <div class="seg" id="colSeg">
      <button data-col="1" class="${prefs.columns===1?'active':''}">1</button>
      <button data-col="2" class="${prefs.columns===2?'active':''}">2</button>
    </div>
    <div class="seg" id="fitSeg">
      <button data-fit="auto" class="${prefs.fitMode!=='wrap'?'active':''}" title="Shrink text so nothing wraps">Auto</button>
      <button data-fit="wrap" class="${prefs.fitMode==='wrap'?'active':''}" title="Keep font size fixed; wrap long lines">Wrap</button>
    </div>
    <div class="seg" id="fontSizeSeg" title="Base font size for chords/lyrics -- remembered on this device">
      <button id="fontDec" title="Smaller">A−</button>
      <span class="font-size-label" id="fontSizeLabel">${getFontSize()}px</span>
      <button id="fontInc" title="Larger">A+</button>
    </div>
    <div class="seg" id="blankSeg" title="Multiple consecutive blank lines in the source text">
      <button data-blank="1" class="${getCollapseBlanks()?'active':''}" title="Merge multiple blank lines into a single gap">Merge</button>
      <button data-blank="0" class="${!getCollapseBlanks()?'active':''}" title="Keep every blank line as its own gap">Keep</button>
    </div>
    ${videoIds.length && canEmbed ? `<button class="iconbtn ${getYoutubeEnabled()?'primary':''}" id="videoToggleBtn" title="Show/hide the YouTube video for this song -- remembered on this device">📺</button>` : ''}
    <button class="iconbtn primary" id="presentOne" title="Present fullscreen">▶</button>
    <button class="iconbtn" id="editSongBtn" title="Edit song">✎</button>`;

  const showVideo = canEmbed && videoIds.length && getYoutubeEnabled();
  const videoWidth = VIDEO_SIZES[getVideoSize()];
  const canNavigate = STATE.songs.length > 1;
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    ${showVideo ? `
    <div class="video-row" id="videoRow">
      <div class="seg video-size-seg" id="videoSizeSeg" title="Player size -- remembered on this device">
        <button data-size="small" class="${getVideoSize()==='small'?'active':''}">S</button>
        <button data-size="medium" class="${getVideoSize()==='medium'?'active':''}">M</button>
        <button data-size="large" class="${getVideoSize()==='large'?'active':''}">L</button>
      </div>
      ${videoIds.map(id=>`<div class="video-embed" style="width:${videoWidth}px;"><iframe src="https://www.youtube-nocookie.com/embed/${id}" title="YouTube video" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`).join('')}
    </div>` : ''}
    <div class="song-nav-wrap">
      ${canNavigate ? `<button class="tap-zone left" id="songPrev" title="Previous song"><span class="tap-chevron">‹</span></button>` : ''}
      ${canNavigate ? `<button class="tap-zone right" id="songNext" title="Next song"><span class="tap-chevron">›</span></button>` : ''}
      <div class="chart-card"><div class="chart mono" id="songChart"></div></div>
    </div>`;
  viewRoot.innerHTML=''; viewRoot.appendChild(wrap);

  if (canNavigate){
    wrap.querySelector('#songPrev').addEventListener('click', ()=>navigateToAdjacentSong(-1));
    wrap.querySelector('#songNext').addEventListener('click', ()=>navigateToAdjacentSong(1));
  }

  if (videoIds.length && canEmbed){
    slot.querySelector('#videoToggleBtn').addEventListener('click', ()=>{
      setYoutubeEnabled(!getYoutubeEnabled());
      renderSongView(songId);
    });
  }
  if (showVideo){
    document.getElementById('videoSizeSeg').addEventListener('click', (e)=>{
      const btn = e.target.closest('button[data-size]'); if (!btn) return;
      setVideoSize(btn.dataset.size);
      document.querySelectorAll('#videoSizeSeg button').forEach(b=>b.classList.toggle('active', b===btn));
      const px = VIDEO_SIZES[btn.dataset.size];
      document.querySelectorAll('#videoRow .video-embed').forEach(el=> el.style.width = px+'px');
      repaint();
    });
  }

  slot.querySelector('#backBtn').addEventListener('click', ()=>go({view:'list'}));
  slot.querySelector('#presentOne').addEventListener('click', ()=>{
    const idx = STATE.setlist.indexOf(song.id);
    openPresent(idx===-1? [song.id] : STATE.setlist, idx===-1?0:idx);
  });
  slot.querySelector('#keyBadgeBtn').addEventListener('click', openKeyModal);
  slot.querySelector('#editSongBtn').addEventListener('click', ()=>{
    go({view:'edit', songId: song.id});
  });

  const chartEl = document.getElementById('songChart');
  const chartCard = chartEl.parentElement;
  function repaint(){
    const rows = computeSongRows(song, prefs.mode, prefs.target);
    requestAnimationFrame(()=>{
      const boxWidth = chartCard.clientWidth - 28;   // minus 14px+14px horizontal padding
      if (prefs.fitMode === 'wrap'){
        chartCard.style.height = 'auto';
        chartCard.style.overflow = 'visible';
        layoutChart(chartEl, rows, prefs.columns, boxWidth, Infinity, {fitMode:'wrap', fontSize: getFontSize()});
      } else {
        const top = chartCard.getBoundingClientRect().top;
        const cardHeight = Math.max(160, window.innerHeight - top - 24);
        chartCard.style.height = cardHeight + 'px';
        chartCard.style.overflow = 'hidden';
        const boxHeight = cardHeight - 28;           // minus 14px+14px vertical padding
        const result = layoutChart(chartEl, rows, prefs.columns, boxWidth, boxHeight, {fitMode:'auto'});
        if (result.scrolled){
          // Even the smallest usable size couldn't flow everything into the
          // available columns -- let the card grow and the page scroll
          // rather than silently clipping content.
          chartCard.style.height = 'auto';
          chartCard.style.overflow = 'visible';
        }
      }
    });
  }
  repaint();
  activeSongRepaint = repaint;

  function syncModeUI(){
    document.getElementById('keyBadgeBtn').textContent = keyBadgeText();
    repaint();
  }
  function openKeyModal(){
    function paint(){
      modalBox.style.maxWidth = '340px';
      modalBox.innerHTML = `
        <h3>Key</h3>
        <p class="msg">Choose how chords are shown for this song.</p>
        <div class="seg" id="modalModeSeg" style="width:100%;">
          <button data-mode="original" class="${prefs.mode==='original'?'active':''}" style="flex:1;">Original</button>
          <button data-mode="transposed" class="${prefs.mode==='transposed'?'active':''}" style="flex:1;">Transpose</button>
          <button data-mode="nashville" class="${prefs.mode==='nashville'?'active':''}" style="flex:1;">Numbers</button>
        </div>
        ${prefs.mode==='transposed' ? `<select id="modalKeySel" style="width:100%;margin-top:12px;padding:9px 10px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper);color:var(--ink);">${keyOptionsHTML(prefs.target)}</select>` : ''}
        <div class="modal-actions"><button class="iconbtn primary" id="modalOk">Done</button></div>`;
      modalBox.querySelector('#modalModeSeg').addEventListener('click', (e)=>{
        const btn = e.target.closest('button'); if (!btn) return;
        prefs.mode = btn.dataset.mode;
        syncModeUI();
        paint();
      });
      const modalKeySel = modalBox.querySelector('#modalKeySel');
      if (modalKeySel) modalKeySel.addEventListener('change', (e)=>{ prefs.target = e.target.value; syncModeUI(); });
      modalBox.querySelector('#modalOk').addEventListener('click', closeModal);
    }
    paint();
    modalBackdrop.classList.add('open');
  }

  document.getElementById('colSeg').addEventListener('click', (e)=>{
    const btn = e.target.closest('button'); if (!btn) return;
    prefs.columns = Number(btn.dataset.col);
    setDefaultColumns(prefs.columns);
    document.querySelectorAll('#colSeg button').forEach(b=>b.classList.toggle('active', b===btn));
    repaint();
  });
  document.getElementById('fitSeg').addEventListener('click', (e)=>{
    const btn = e.target.closest('button'); if (!btn) return;
    prefs.fitMode = btn.dataset.fit;
    setDefaultFitMode(prefs.fitMode);
    document.querySelectorAll('#fitSeg button').forEach(b=>b.classList.toggle('active', b===btn));
    repaint();
  });
  // A-/A+ always work, even in Auto mode: nudging the size is a manual
  // override, so it switches this song to Wrap (fixed size) to hold it --
  // otherwise Auto's search would just recompute its own size and undo it.
  function bumpFontSize(delta){
    if (prefs.fitMode !== 'wrap'){
      prefs.fitMode = 'wrap';
      setDefaultFitMode('wrap');
      document.querySelectorAll('#fitSeg button').forEach(b=>b.classList.toggle('active', b.dataset.fit==='wrap'));
    }
    setFontSize(getFontSize()+delta);
    document.getElementById('fontSizeLabel').textContent = getFontSize()+'px';
    repaint();
  }
  document.getElementById('fontDec').addEventListener('click', ()=> bumpFontSize(-1));
  document.getElementById('fontInc').addEventListener('click', ()=> bumpFontSize(1));
  document.getElementById('blankSeg').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-blank]'); if (!btn) return;
    setCollapseBlanks(btn.dataset.blank === '1');
    document.querySelectorAll('#blankSeg button').forEach(b=>b.classList.toggle('active', b===btn));
    repaint();
  });
}

// Swipe left/right on the (non-fullscreen) song page to jump to the
// next/previous song, in the same order they appear in the song list.
function navigateToAdjacentSong(delta){
  const list = STATE.songs;
  if (list.length < 2) return;
  const idx = list.findIndex(s=>s.id===route.songId);
  if (idx === -1) return;
  const next = list[((idx+delta) % list.length + list.length) % list.length];
  go({view:'song', songId: next.id});
}
let songTouchStartX=null, songTouchStartY=null;
viewRoot.addEventListener('touchstart', (e)=>{
  if (route.view !== 'song') return;
  songTouchStartX = e.touches[0].clientX; songTouchStartY = e.touches[0].clientY;
}, {passive:true});
viewRoot.addEventListener('touchend', (e)=>{
  if (route.view !== 'song' || songTouchStartX===null) return;
  const dx = e.changedTouches[0].clientX - songTouchStartX;
  const dy = e.changedTouches[0].clientY - songTouchStartY;
  songTouchStartX = null; songTouchStartY = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    navigateToAdjacentSong(dx < 0 ? 1 : -1);
  }
});

/* =========================================================================
   8. Present (fullscreen setlist) mode
   ========================================================================= */
const presentEl = document.getElementById('present');
let presentQueue = [];
let presentIdx = 0;

function openPresent(songIds, startIdx){
  if (!songIds || songIds.length===0){ toast('The setlist is empty'); return; }
  presentQueue = songIds;
  presentIdx = startIdx||0;
  presentEl.classList.add('open');
  document.body.style.overflow='hidden';
  paintPresent();
}
function closePresent(){
  presentEl.classList.remove('open');
  document.body.style.overflow='';
}
function paintPresent(){
  const song = STATE.songs.find(s=>s.id===presentQueue[presentIdx]);
  if (!song){ closePresent(); return; }
  document.getElementById('presentCounter').textContent = `${presentIdx+1} / ${presentQueue.length}`;
  document.getElementById('presentTitle').textContent = splitTitleArtist(song.title).main;
  const prefs = songViewPrefs[song.id] || {mode:'original', target: songKeyValue(song), columns: getDefaultColumns(), fitMode: getDefaultFitMode()};
  const rows = computeSongRows(song, prefs.mode, prefs.target);
  const chartEl = document.getElementById('presentChart');
  requestAnimationFrame(()=>{
    const box = document.querySelector('.present-chart-wrap');
    layoutChart(chartEl, rows, prefs.columns, box.clientWidth, box.clientHeight, {fitMode: prefs.fitMode, fontSize: getFontSize()});
  });
}
function presentStep(delta){
  const n = presentQueue.length;
  presentIdx = ((presentIdx+delta)%n+n)%n;
  paintPresent();
}
document.getElementById('presentPrev').addEventListener('click', ()=>presentStep(-1));
document.getElementById('presentNext').addEventListener('click', ()=>presentStep(1));
document.getElementById('presentClose').addEventListener('click', closePresent);
document.addEventListener('keydown', (e)=>{
  if (!presentEl.classList.contains('open')) return;
  if (e.key==='Escape') closePresent();
  else if (e.key==='ArrowRight') presentStep(1);
  else if (e.key==='ArrowLeft') presentStep(-1);
});
let touchStartX=null, touchStartY=null;
presentEl.addEventListener('touchstart', (e)=>{ touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; }, {passive:true});
presentEl.addEventListener('touchend', (e)=>{
  if (touchStartX===null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    presentStep(dx<0 ? 1 : -1);
  }
  touchStartX=null; touchStartY=null;
});
window.addEventListener('resize', ()=>{
  if (presentEl.classList.contains('open')) paintPresent();
  else if (route.view==='song' && activeSongRepaint) activeSongRepaint();
});

/* =========================================================================
   9. Init
   ========================================================================= */
(async function init(){
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{ if (route.view==='song') renderSongView(route.songId); if (presentEl.classList.contains('open')) paintPresent(); });
  }
  render();
})();
</script>
